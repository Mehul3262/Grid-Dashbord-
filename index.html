<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehul Grid Live - Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center;
        }
        .container { 
            width: 100%; 
            max-width: 450px; 
        }
        
        /* Header Section */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #333; 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
        }
        .header h1 { 
            color: #f39c12; 
            font-size: 18px; 
            margin: 0; 
            letter-spacing: 1.5px; 
            text-transform: uppercase;
        }
        .status-badge { 
            background: rgba(46, 204, 113, 0.1); 
            color: #2ecc71; 
            padding: 4px 10px; 
            border-radius: 4px; 
            font-size: 11px; 
            border: 1px solid #2ecc71; 
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Grid Layout */
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
        }
        .card { 
            background-color: #1a1a24; 
            border: 1px solid #2a2a36; 
            border-radius: 6px; 
            padding: 15px 10px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        .card.full-width { 
            grid-column: span 2; 
        }
        
        /* Card Texts */
        .label { 
            color: #8a8a9d; 
            font-size: 10px; 
            text-transform: uppercase; 
            margin-bottom: 8px; 
            letter-spacing: 0.5px; 
            font-weight: bold; 
        }
        .value { 
            font-size: 17px; 
            font-weight: bold; 
        }

        /* Colors */
        .profit { color: #2ecc71; }
        .loss { color: #e74c3c; }
        .neutral { color: #ecf0f1; }
        .warning { color: #f1c40f; }

        /* Special Cards */
        .target-card { border: 1px solid #f39c12; }
        .status-card { border: 1px solid #2ecc71; background-color: rgba(46, 204, 113, 0.05); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Mehul Grid Live</h1>
        <div class="status-badge">● ONLINE</div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="label">Balance</div>
            <div class="value profit" id="balance">$0.00</div>
        </div>
        <div class="card">
            <div class="label">Today P/L</div>
            <div class="value" id="today_pl">$0.00</div>
        </div>

        <div class="card">
            <div class="label">Floating P/L</div>
            <div class="value" id="floating_pl">$0.00</div>
        </div>
        <div class="card">
            <div class="label">Open Trades</div>
            <div class="value neutral" id="open_trades">0 (B:0 / S:0)</div>
        </div>

        <div class="card">
            <div class="label">Max Drawdown</div>
            <div class="value loss" id="max_dd">$0.00</div>
        </div>
        <div class="card">
            <div class="label">Max Margin Use</div>
            <div class="value neutral" id="max_margin">$0.00</div>
        </div>

        <div class="card">
            <div class="label">Cycle Profit</div>
            <div class="value" id="cycle_profit">$0.00</div>
        </div>
        <div class="card">
            <div class="label">Bot Uptime</div>
            <div class="value warning" id="uptime">0h 0m</div>
        </div>

        <div class="card">
            <div class="label">One-Side Lock</div>
            <div class="value" id="one_side_lock">OFF</div>
        </div>
        <div class="card">
            <div class="label">Cycle Dynamic Stop</div>
            <div class="value loss" id="dynamic_stop">-$0.00</div>
        </div>

        <div class="card">
            <div class="label">Peak Basket Profit</div>
            <div class="value profit" id="peak_basket">$0.00</div>
        </div>
