<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEHUL GRID LIVE</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .header h1 { color: #FFA500; font-size: 20px; margin: 0; }
        .status-badge { background-color: #004d00; color: #00FF00; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 14px; border: 1px solid #00FF00; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background-color: #1e1e1e; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        .card-title { font-size: 12px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
        .card-value { font-size: 18px; font-weight: bold; }
        .text-green { color: #00FF00; }
        .text-red { color: #FF4500; }
        .text-yellow { color: #FFA500; }
        .text-white { color: #FFFFFF; }
        .sub-text { font-size: 12px; color: #ccc; margin-top: 5px; }
        .full-width { grid-column: span 2; }
    </style>
</head>
<body>

    <div class="header">
        <h1>MEHUL GRID LIVE</h1>
        <div class="status-badge">● ONLINE</div>
    </div>

    <div class="grid-container">
        <div class="card"><div class="card-title">Balance</div><div class="card-value text-green" id="balance">$0.00</div></div>
        <div class="card"><div class="card-title">Today P/L</div><div class="card-value text-green" id="today_pl">$0.00</div></div>
        
        <div class="card"><div class="card-title">Floating P/L</div><div class="card-value text-red" id="floating_pl">$0.00</div></div>
        <div class="card">
            <div class="card-title">Open Trades</div>
            <div class="card-value text-white" id="total_trades">0</div>
            <div class="sub-text" id="trade_details">A(B:0 S:0) | B(B:0 S:0)</div>
        </div>

        <div class="card"><div class="card-title">Max Drawdown</div><div class="card-value text-red" id="max_dd">$0.00</div></div>
        <div class="card"><div class="card-title">Max Margin Use</div><div class="card-value text-white" id="max_margin">$0.00</div></div>

        <div class="card"><div class="card-title">Current Margin</div><div class="card-value text-white" id="current_margin">$0.00</div></div>
        <div class="card"><div class="card-title">Bot Uptime</div><div class="card-value text-yellow" id="uptime">0h 0m</div></div>

        <div class="card"><div class="card-title">ADX (20)</div><div class="card-value text-white" id="adx">0.00</div></div>
        <div class="card"><div class="card-title">ATR (14)</div><div class="card-value text-white" id="atr">0.0000</div></div>

        <div class="card"><div class="card-title">Max Open (A+B)</div><div class="card-value text-white" id="max_open_trades">0</div></div>
        <div class="card">
            <div class="card-title">Scan Speed (ms)</div>
            <div class="card-value text-white" id="scan_speed">0.00</div>
        </div>

        <div class="card full-width" style="border-color: #FFA500;">
            <div class="card-title" style="color: #FFA500;">BASKET TARGET</div>
            <div class="card-value text-white" id="basket_target">$0.00</div>
        </div>
    </div>

    <script>
        // અપડેટ કરેલી ફાયરબેઝ લિંક (અહીં .json લગાવેલું જ છે)
        const FIREBASE_URL = "https://mehul-grid-dashboard-default-rtdb.firebaseio.com/MehulGridData.json";

        async function fetchData() {
            try {
                const response = await fetch(FIREBASE_URL);
                const data = await response.json();
                
                if(data) {
                    document.getElementById('balance').innerText = "$" + data.balance.toFixed(2);
                    
                    let todayPl = document.getElementById('today_pl');
                    todayPl.innerText = "$" + data.today_pl.toFixed(2);
                    todayPl.className = data.today_pl >= 0 ? "card-value text-green" : "card-value text-red";

                    let floatingPl = document.getElementById('floating_pl');
                    floatingPl.innerText = "$" + data.floating_pl.toFixed(2);
                    floatingPl.className = data.floating_pl >= 0 ? "card-value text-green" : "card-value text-red";

                    document.getElementById('total_trades').innerText = data.open_trades_total;
                    document.getElementById('trade_details').innerText = `A(B:${data.bot_a_buy} S:${data.bot_a_sell}) | B(B:${data.bot_b_buy} S:${data.bot_b_sell})`;
                    
                    document.getElementById('max_dd').innerText = "$" + data.max_dd.toFixed(2);
                    document.getElementById('max_margin').innerText = "$" + data.max_margin.toFixed(2);
                    document.getElementById('current_margin').innerText = "$" + data.current_margin.toFixed(2);
                    document.getElementById('uptime').innerText = data.uptime;
                    
                    document.getElementById('adx').innerText = data.adx.toFixed(2);
                    document.getElementById('atr').innerText = data.atr.toFixed(5);
                    
                    document.getElementById('max_open_trades').innerText = data.max_open_trades;
                    document.getElementById('scan_speed').innerText = data.scan_speed + " ms";
                    document.getElementById('basket_target').innerText = "$" + data.basket_target.toFixed(2);
                }
            } catch (error) {
                console.error("Error fetching data: ", error);
            }
        }

        // દર 1 સેકન્ડે (1000ms) ડેટા રીફ્રેશ થશે
        setInterval(fetchData, 1000);
        fetchData();
    </script>
</body>
</html>
