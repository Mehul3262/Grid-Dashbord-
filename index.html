<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot C Master Dashboard</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            background: #131a2c;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 15px 20px;
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .header h2 {
            margin: 0;
            color: #f59e0b;
            font-size: 18px;
        }
        .live-badge {
            background: #10b981;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 450px;
        }
        .card {
            background: #131a2c;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 12px;
            box-sizing: border-box;
        }
        .card-title {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .card-value {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
        }
        .full-card {
            grid-column: span 2;
            background: #131a2c;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-top: 12px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        .status-footer {
            margin-top: 15px;
            font-size: 12px;
            color: #10b981;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>⚡ BOT C MASTER<br>DASHBOARD</h2>
        <div class="live-badge">LIVE</div>
    </div>

    <div class="grid-container">
        <div class="card">
            <div class="card-title">1) Current Balance</div>
            <div id="balance" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-title">2) Current Margin Use</div>
            <div id="margin_use" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-title">3) Max Margin (24h)</div>
            <div id="max_margin" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-title">4) Open Trades</div>
            <div id="open_trades" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-title">5) Max Open Trades (24h)</div>
            <div id="max_open_trades" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-title">6) Current P/L</div>
            <div id="current_pl" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-title">7) Today's P/L</div>
            <div id="todays_pl" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-title">8) Bot Status</div>
            <div id="bot_status" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-title">9) Max Drawdown (24h)</div>
            <div id="max_drawdown" class="card-value">--</div>
        </div>
        <div class="card">
            <div class="card-title">10) ABC Scan Time</div>
            <div id="abc_scan_time" class="card-value">--</div>
        </div>
    </div>

    <div class="full-card">
        <div class="card-title">Closing Status</div>
        <div id="closing_status" class="card-value" style="margin-top: 5px;">--</div>
    </div>

    <div id="connection-status" class="status-footer">Status: Connecting to Cloud...</div>

    <script>
        const firebaseURL = "https://mehul-grid-dashboard-default-rtdb.firebaseio.com/bot_status.json";

        function fetchBotData() {
            fetch(firebaseURL)
                .then(response => response.json())
                .then(data => {
                    if (data) {
                        document.getElementById('balance').innerText = data.balance || "--";
                        document.getElementById('margin_use').innerText = data.margin_use || "--";
                        document.getElementById('max_margin').innerText = data.max_margin || "--";
                        document.getElementById('open_trades').innerText = data.open_trades || "--";
                        document.getElementById('max_open_trades').innerText = data.max_open_trades || "--";
                        document.getElementById('current_pl').innerText = data.current_pl || "--";
                        document.getElementById('todays_pl').innerText = data.todays_pl || "--";
                        document.getElementById('bot_status').innerText = data.bot_status || "--";
                        document.getElementById('max_drawdown').innerText = data.max_drawdown || "--";
                        document.getElementById('abc_scan_time').innerText = data.abc_scan_time || "--";
                        document.getElementById('closing_status').innerText = data.closing_status || "--";

                        document.getElementById('connection-status').innerText = "Status: Live Connected (Cloud Sync)";
                        document.getElementById('connection-status').style.color = "#10b981";
                    }
                })
                .catch(error => {
                    console.error("Error fetching data:", error);
                    document.getElementById('connection-status').innerText = "Status: Reconnecting...";
                    document.getElementById('connection-status').style.color = "#f59e0b";
                });
        }

        // Fetch data every 1 second
        setInterval(fetchBotData, 1000);
        fetchBotData(); // Initial call
    </script>
</body>
</html>
