<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehul Grid - Compact Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* કોમ્પેક્ટ ડાર્ક બેકગ્રાઉન્ડ */
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'Roboto Mono', monospace; 
            padding: 8px; /* પેડિંગ ઘટાડ્યું */
            font-size: 12px;
        }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 5px; }
        .header h1 { color: #e3b341; font-size: 16px; letter-spacing: 0.5px; margin: 0; }
        
        .status-badge { 
            background: rgba(46, 160, 67, 0.15); 
            color: #3fb950; 
            padding: 3px 8px; 
            border-radius: 4px; 
            font-size: 10px; 
            border: 1px solid rgba(46, 160, 67, 0.4);
            font-weight: 600;
        }
        .status-badge.offline { 
            background: rgba(248, 81, 73, 0.15); 
            color: #f85149; 
            border-color: rgba(248, 81, 73, 0.4); 
        }

        /* ગ્રીડમાં ખાના વચ્ચેનું અંતર ઘટાડ્યું (gap: 6px) */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
        
        .card { 
            background-color: #161b22; 
            padding: 8px 6px; /* કાર્ડની અંદરની જગ્યા ઘટાડી */
            border-radius: 4px; 
            text-align: center; 
            border: 1px solid #30363d; 
        }
        .card.full { grid-column: span 2; padding: 10px 8px; }
        
        .title { color: #8b949e; font-size: 9px; font-weight: 600; text-transform: uppercase; margin-bottom: 3px; }
        .value { font-size: 15px; font-weight: 700; color: #f0f6fc; }
        .value.large { font-size: 17px; }
        
        .green { color: #3fb950 !important; }
        .red { color: #f85149 !important; }
        .yellow { color: #d29922 !important; }
        .blue { color: #58a6ff !important; }

        .progress-container { 
            background: #010409; 
            border-radius: 3px; 
            height: 8px; /* પ્રોગ્રેસ બાર પાતળો કર્યો */
            width: 100%; 
            margin-top: 6px; 
            border: 1px solid #30363d; 
        }
        .progress-bar { 
            background: #58a6ff; 
            height: 100%; 
            width: 0%; 
            transition: width 0.2s ease; 
        }
        .progress-labels { display: flex; justify-content: space-between; font-size: 9px; color: #8b949e; margin-top: 4px; }
        
        /* ડીસ્પ્લે પર લાંબા ટેક્સ્ટ માટે નાનો ફોન્ટ */
        .text-small { font-size: 12px !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MEHUL GRID LIVE</h1>
        <div class="status-badge" id="conn-status">● ONLINE</div>
    </div>

    <!-- 14 Items Compact Grid -->
    <div class="grid">
        <div class="card"><div class="title">BALANCE</div><div class="value large green" id="balance">--</div></div>
        <div class="card"><div class="title">TODAY P/L</div><div class="value large green" id="today_pnl">--</div></div>
        
        <div class="card"><div class="title">FLOATING P/L</div><div class="value large" id="floating_pnl">--</div></div>
        <div class="card"><div class="title">OPEN TRADES</div><div class="value" id="open_trades">--</div></div>
        
        <div class="card"><div class="title">MAX DRAWDOWN</div><div class="value red" id="max_drawdown">--</div></div>
        <div class="card"><div class="title">MAX MARGIN USE</div><div class="value" id="max_margin">--</div></div>
        
        <div class="card"><div class="title">CURRENT MARGIN</div><div class="value" id="current_margin">--</div></div>
        <div class="card"><div class="title">BOT UPTIME</div><div class="value yellow" id="uptime">--</div></div>
        
        <div class="card"><div class="title">ADX (20)</div><div class="value" id="adx">--</div></div>
        <div class="card"><div class="title">ATR (14)</div><div class="value" id="atr">--</div></div>
        
        <div class="card"><div class="title">MARKET COND.</div><div class="value yellow text-small" id="market_condition">--</div></div>
        <div class="card"><div class="title">ACTIVE CYCLE</div><div class="value blue text-small" id="active_cycle">--</div></div>

        <div class="card"><div class="title">MAX OPEN (CYC)</div><div class="value" id="max_open_trades">--</div></div>
        <div class="card"><div class="title">SCAN SPEED</div><div class="value text-small" style="color: #8b949e;" id="scan_ms">--</div></div>
        
        <div class="card full" style="border-color: #d29922;">
            <div class="title" style="color: #d29922;">TARGET RULE</div>
            <div class="value text-small" id="target_rule">--</div>
        </div>
        
        <div class="card full">
            <div class="title" id="basket_title">BASKET PROGRESS</div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-fill"></div>
            </div>
            <div class="progress-labels">
                <span>$0.00</span>
                <span id="basket_max_lbl">$0.00</span>
            </div>
        </div>

        <div class="card full" style="border-color: #3fb950; background-color: rgba(63, 185, 80, 0.05);">
            <div class="title" style="color: #3fb950;">BOT STATUS</div>
            <div class="value green text-small" id="closing_status">--</div>
        </div>
    </div>
</div>

<script>
    const FIREBASE_URL = "https://mehul-grid-dashboard-default-rtdb.firebaseio.com/bot_status.json";
    let lastFetchTime = Date.now();

    async function fetchLiveData() {
        try {
            const response = await fetch(FIREBASE_URL + "?r=" + Math.random());
            const data = await response.json();
            
            if (data) {
                document.getElementById('balance').innerText = data.balance || '--';
                document.getElementById('today_pnl').innerText = data.today_pnl || '--';
                document.getElementById('open_trades').innerText = data.open_trades || '--';
                document.getElementById('max_drawdown').innerText = data.max_drawdown || '--';
                document.getElementById('max_margin').innerText = data.max_margin || '--';
                document.getElementById('current_margin').innerText = data.current_margin || '--';
                document.getElementById('uptime').innerText = data.uptime || '--';
                document.getElementById('adx').innerText = data.adx || '--';
                document.getElementById('atr').innerText = data.atr || '--';
                document.getElementById('market_condition').innerText = data.market_condition || '--';
                document.getElementById('active_cycle').innerText = data.active_cycle || '--';
                document.getElementById('target_rule').innerText = data.target_rule || '--';
                document.getElementById('max_open_trades').innerText = data.max_open_trades || '0';
                document.getElementById('scan_ms').innerText = data.scan_ms || '--';
                document.getElementById('closing_status').innerText = data.closing_status || '--';

                const floatEl = document.getElementById('floating_pnl');
                floatEl.innerText = data.floating_pnl || '--';
                if(data.floating_pnl && data.floating_pnl.includes('-')) {
                    floatEl.className = "value large red";
                } else {
                    floatEl.className = "value large green";
                }

                const current = parseFloat(data.basket_current) || 0;
                const max = parseFloat(data.basket_max) || 100;
                let percent = (current / max) * 100;
                if(percent < 0) percent = 0;
                if(percent > 100) percent = 100;
                
                document.getElementById('progress-fill').style.width = percent + '%';
                document.getElementById('basket_max_lbl').innerText = "$" + max.toFixed(2);
                document.getElementById('basket_title').innerText = data.basket_target || "TARGET PROGRESS";

                document.getElementById('conn-status').innerText = "● ONLINE";
                document.getElementById('conn-status').className = "status-badge";
                lastFetchTime = Date.now();
            }
        } catch (error) {
            console.error("Firebase Error:", error);
        }
    }

    setInterval(() => {
        if (Date.now() - lastFetchTime > 5000) {
            document.getElementById('conn-status').innerText = "● OFFLINE";
            document.getElementById('conn-status').className = "status-badge offline";
        }
    }, 1000);

    fetchLiveData();
    setInterval(fetchLiveData, 500);
</script>

</body>
</html>
