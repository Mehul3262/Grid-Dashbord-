<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Pro Grid Bot - Live Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 15px rgba(0,255,100,0.2); }
        h2 { color: #00ff66; }
        .card { background: #2a2a2a; margin: 10px 0; padding: 15px; border-radius: 5px; display: flex; justify-content: space-between; font-size: 18px; }
        .label { color: #b0b0b0; }
        .value { font-weight: bold; }
        .profit { color: #00ff66; }
        .loss { color: #ff4444; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gold Pro Grid Bot Live</h2>
    <div class="card"><span class="label">Current Balance:</span> <span class="value" id="balance">Loading...</span></div>
    <div class="card"><span class="label">Floating P/L:</span> <span class="value" id="floating_pl">Loading...</span></div>
    <div class="card"><span class="label">Today's Profit:</span> <span class="value" id="todays_profit">Loading...</span></div>
    <div class="card"><span class="label">Max Margin:</span> <span class="value" id="max_margin">Loading...</span></div>
    <div class="card"><span class="label">One-Side Lock:</span> <span class="value" id="one_side_lock">Loading...</span></div>
    <div class="card"><span class="label">Open Trades (Buy/Sell):</span> <span class="value" id="trades">Loading...</span></div>
    <div class="card"><span class="label">Max Trades (24h):</span> <span class="value" id="max_trades">Loading...</span></div>
    <div class="card"><span class="label">Max Drawdown (24h):</span> <span class="value" id="max_dd">Loading...</span></div>
    <div class="card"><span class="label">Scan Speed:</span> <span class="value" id="scan_speed">Loading...</span></div>
    <div class="card"><span class="label">Bot Uptime:</span> <span class="value" id="uptime">Loading...</span></div>
</div>

<script>
    async function fetchBotData() {
        try {
            // અહીં તમારી સાચી લિંક મૂકી છે
            let response = await fetch('https://mehul-grid-dashboard-default-rtdb.firebaseio.com/MehulGridData.json');
            let data = await response.json();

            if (!data) return;

            document.getElementById('balance').innerText = "$" + Number(data.balance || 0).toFixed(2);
            
            let fpl = document.getElementById('floating_pl');
            let fplVal = Number(data.floating_pl || 0);
            fpl.innerText = "$" + fplVal.toFixed(2);
            fpl.className = "value " + (fplVal >= 0 ? "profit" : "loss");

            let tprof = document.getElementById('todays_profit');
            // બોટમાંથી આવતા સાચા નામ (today_pl) નો ઉપયોગ
            let tprofVal = Number(data.today_pl || 0);
            tprof.innerText = "$" + tprofVal.toFixed(2);
            tprof.className = "value " + (tprofVal >= 0 ? "profit" : "loss");

            document.getElementById('max_margin').innerText = "$" + Number(data.max_margin || 0).toFixed(2);
            document.getElementById('one_side_lock').innerText = data.one_side_lock || "OFF";

            document.getElementById('trades').innerText = (data.bot_a_buy || 0) + " / " + (data.bot_a_sell || 0);
            document.getElementById('max_trades').innerText = data.open_trades_total || 0;
            document.getElementById('max_dd').innerText = "$" + Number(data.max_dd || 0).toFixed(2);
            document.getElementById('scan_speed').innerText = (data.scan_speed || 0) + " ms";
            document.getElementById('uptime').innerText = data.uptime || "00:00:00";
        } catch (error) {
            console.error("Error loading Firebase data:", error);
        }
    }

    setInterval(fetchBotData, 2000); 
    fetchBotData();
</script>

</body>
</html>
