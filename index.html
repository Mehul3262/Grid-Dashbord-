<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot C Master Dashboard</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #131b2e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #1f293d;
        }
        .title {
            color: #f3ba2f;
            font-weight: bold;
            font-size: 18px;
        }
        .live-badge {
            background-color: #00c853;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .card {
            background: #131b2e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f293d;
        }
        .card-full {
            background: #131b2e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f293d;
            margin-bottom: 12px;
            text-align: center;
        }
        .label {
            font-size: 11px;
            color: #8a99ad;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .value {
            font-size: 18px;
            font-weight: bold;
        }
        .green { color: #00c853; }
        .red { color: #ff5252; }
        .yellow { color: #ffeb3b; }
        .white { color: #ffffff; }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #6b7280;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">⚡ BOT C MASTER DASHBOARD</div>
        <div class="live-badge">LIVE</div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="label">1) Current Balance</div>
            <div class="value white" id="val-balance">--</div>
        </div>
        <div class="card">
            <div class="label">2) Current Margin Use</div>
            <div class="value white" id="val-margin">--</div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="label">3) Max Margin (24h)</div>
            <div class="value white" id="val-max-margin">--</div>
        </div>
        <div class="card">
            <div class="label">4) Open Trades</div>
            <div class="value white" id="val-open-trades">--</div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="label">5) Max Open Trades (24h)</div>
            <div class="value yellow" id="val-max-open">--</div>
        </div>
        <div class="card">
            <div class="label">6) Current P/L</div>
            <div class="value" id="val-current-pl">--</div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="label">7) Today's P/L</div>
            <div class="value" id="val-today-pl">--</div>
        </div>
        <div class="card">
            <div class="label">8) Bot Status</div>
            <div class="value white" style="font-size: 13px;" id="val-bot-status">--</div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="label">9) Max Drawdown (24h)</div>
            <div class="value red" id="val-max-dd">--</div>
        </div>
        <div class="card">
            <div class="label">10) ABC Scan Time</div>
            <div class="value yellow" id="val-scan-time">--</div>
        </div>
    </div>

    <div class="card-full">
        <div class="label">Closing Status</div>
        <div class="value yellow" id="val-closing-status">--</div>
    </div>

    <div class="footer" id="last-updated">Last Updated: --</div>
</div>

<script>
    // MT5 થી અપડેટ થતી JSON ફાઇલનું નામ અહીં લખો (દા.ત. data.json)
    const jsonFileUrl = 'data.json'; 

    function fetchData() {
        fetch(jsonFileUrl + '?t=' + new Date().getTime()) // કેશ પ્રોબ્લેમ રોકવા માટે ટાઈમસ્ટેમ્પ ઉમેર્યું છે
            .then(response => response.json())
            .then(data => {
                // ૧) Current Balance
                document.getElementById('val-balance').innerText = "$" + parseFloat(data.balance).toFixed(2);
                
                // ૨) Current Margin Use
                document.getElementById('val-margin').innerText = "$" + parseFloat(data.marginUse).toFixed(2);
                
                // ૩) Max Margin (24h)
                document.getElementById('val-max-margin').innerText = "$" + parseFloat(data.maxMargin24h).toFixed(2);
                
                // ૪) Open Trades
                document.getElementById('val-open-trades').innerText = `Buy: ${data.buyTrades} | Sell: ${data.sellTrades}`;
                
                // ૫) Max Open Trades (24h)
                document.getElementById('val-max-open').innerText = data.maxOpenTrades24h;
                
                // ૬) Current P/L (ઓટો કલર ચેન્જ સાથે)
                let currentPL = parseFloat(data.currentPL);
                let plElement = document.getElementById('val-current-pl');
                plElement.innerText = (currentPL < 0 ? "-$" : "$") + Math.abs(currentPL).toFixed(2);
                plElement.className = currentPL < 0 ? "value red" : "value green";

                // ૭) Today's P/L
                let todayPL = parseFloat(data.todayPL);
                let todayPlElement = document.getElementById('val-today-pl');
                todayPlElement.innerText = (todayPL < 0 ? "-$" : "$") + Math.abs(todayPL).toFixed(2);
                todayPlElement.className = todayPL < 0 ? "value red" : "value green";

                // ૮) Bot Status
                document.getElementById('val-bot-status').innerText = data.botStatus;

                // ૯) Max Drawdown (24h) - સાચી ગણતરી (પિક વેલ્યુથી ડાઉનફોલ)
                document.getElementById('val-max-dd').innerText = "$" + parseFloat(data.maxDrawdown24h).toFixed(2);

                // ૧૦) ABC Scan Time
                document.getElementById('val-scan-time').innerText = data.scanTime + " ms";

                // Closing Status
                document.getElementById('val-closing-status').innerText = data.closingStatus;

                // Last Updated Time
                let now = new Date();
                document.getElementById('last-updated').innerText = "Last Updated: " + now.toISOString().slice(0, 10) + " " + now.toTimeString().slice(0, 8);
            })
            .catch(error => console.log('Error loading data:', error));
    }

    // દર ૫ સેકન્ડે ડેટા ઓટોમેટિક રિફ્રેશ થશે
    setInterval(fetchData, 5000);
    window.onload = fetchData;
</script>

</body>
</html>
