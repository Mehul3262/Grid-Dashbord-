<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehul Grid EA - Live Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #e1e6ed; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #1e2638; }
        .header h1 { font-size: 18px; color: #f0b90b; }
        .live-tag { background: #0ecb81; color: #000; padding: 4px 8px; font-weight: bold; border-radius: 4px; font-size: 11px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .card { background: #161b26; border: 1px solid #1e2638; padding: 14px; border-radius: 8px; }
        .card h3 { font-size: 11px; color: #848e9c; margin-bottom: 6px; text-transform: uppercase; }
        .card .value { font-size: 18px; font-weight: bold; }
        
        .positive { color: #0ecb81; }
        .negative { color: #f6465d; }
        .neutral { color: #f0b90b; }

        .progress-box { margin-top: 15px; background: #161b26; border: 1px solid #1e2638; padding: 14px; border-radius: 8px; }
        .progress-bar-bg { background: #2b313a; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { background: linear-gradient(90deg, #f0b90b, #0ecb81); height: 100%; width: 0%; transition: width 0.5s ease; }

        .footer { margin-top: 20px; text-align: center; color: #5e6673; font-size: 11px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🤖 MEHUL GRID EA</h1>
        <span class="live-tag" id="status-tag">CONNECTING...</span>
    </div>

    <div class="grid-container">
        <div class="card">
            <h3>Balance</h3>
            <div class="value" id="balance">$0.00</div>
        </div>
        <div class="card">
            <h3>Today PnL</h3>
            <div class="value positive" id="today_pnl">$0.00</div>
        </div>
        <div class="card">
            <h3>Floating PnL</h3>
            <div class="value" id="floating_pnl">$0.00</div>
        </div>
        <div class="card">
            <h3>Open Trades</h3>
            <div class="value" id="open_trades">0</div>
        </div>
        <div class="card">
            <h3>TF1 Signal</h3>
            <div class="value" id="tf1_dir">--</div>
        </div>
        <div class="card">
            <h3>TF2 Signal</h3>
            <div class="value" id="tf2_dir">--</div>
        </div>
        <div class="card">
            <h3>Max Drawdown</h3>
            <div class="value negative" id="max_dd">$0.00</div>
        </div>
        <div class="card">
            <h3>Max Margin</h3>
            <div class="value" id="max_margin">$0.00</div>
        </div>
    </div>

    <div class="progress-box">
        <h3>Basket Target Progress ($<span id="target_val">30</span>)</h3>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <div class="footer">
        Last Updated: <span id="last_update">Never</span>
    </div>

    <script>
        const DB_URL = "https://mehul-grid-dashboard-default-rtdb.firebaseio.com/live_data.json";

        async function fetchLiveData() {
            try {
                const response = await fetch(DB_URL);
                if (!response.ok) return;
                const data = await response.json();

                if (data) {
                    document.getElementById('balance').innerText = '$' + data.balance.toFixed(2);
                    document.getElementById('today_pnl').innerText = '$' + data.today_pnl.toFixed(2);
                    
                    const floatElem = document.getElementById('floating_pnl');
                    floatElem.innerText = '$' + data.floating_pnl.toFixed(2);
                    floatElem.className = 'value ' + (data.floating_pnl >= 0 ? 'positive' : 'negative');

                    document.getElementById('open_trades').innerText = data.open_trades;
                    document.getElementById('max_dd').innerText = '$' + data.max_dd.toFixed(2);
                    document.getElementById('max_margin').innerText = '$' + data.max_margin.toFixed(2);
                    document.getElementById('target_val').innerText = data.target_usd;
                    document.getElementById('last_update').innerText = data.last_update;

                    document.getElementById('tf1_dir').innerText = data.tf1_dir;
                    document.getElementById('tf1_dir').className = 'value ' + (data.tf1_dir === 'BUY' ? 'positive' : 'negative');
                    document.getElementById('tf2_dir').innerText = data.tf2_dir;
                    document.getElementById('tf2_dir').className = 'value ' + (data.tf2_dir === 'BUY' ? 'positive' : 'negative');

                    let progress = (data.floating_pnl / data.target_usd) * 100;
                    if(progress < 0) progress = 0;
                    if(progress > 100) progress = 100;
                    document.getElementById('progress-fill').style.width = progress + '%';

                    document.getElementById('status-tag').innerText = 'LIVE';
                    document.getElementById('status-tag').style.background = '#0ecb81';
                }
            } catch (err) {
                document.getElementById('status-tag').innerText = 'OFFLINE';
                document.getElementById('status-tag').style.background = '#f6465d';
            }
        }

        setInterval(fetchLiveData, 2000);
        fetchLiveData();
    </script>
</body>
</html>
