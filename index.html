<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEHUL GRID EA - Live Dashboard</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #131b2e;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #1f2a44;
        }
        .title {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 0.5px;
            color: #facc15;
        }
        .live-badge {
            background-color: #10b981;
            color: #0b0f19;
            font-weight: bold;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .grid-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .card {
            background-color: #131b2e;
            border: 1px solid #1f2a44;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card.full-width {
            grid-column: span 2;
        }
        .card-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .card-value {
            font-size: 20px;
            font-weight: 700;
            font-family: monospace;
        }
        .green { color: #10b981; }
        .red { color: #ef4444; }
        .yellow { color: #facc15; }
        .white { color: #ffffff; }
        .footer-time {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="title">🤖 MEHUL GRID EA</div>
        <div class="live-badge">LIVE</div>
    </div>

    <div class="grid-grid">
        <div class="card">
            <div class="card-label">Balance / Equity</div>
            <div class="card-value white" id="val-bal-eq" style="font-size: 15px;">$0.00 / $0.00</div>
        </div>
        <div class="card">
            <div class="card-label">Today PNL</div>
            <div class="card-value green" id="val-todaypl">$0.00</div>
        </div>

        <div class="card">
            <div class="card-label">Floating PNL</div>
            <div class="card-value red" id="val-floatingpl">$0.00</div>
        </div>
        <div class="card">
            <div class="card-label">Open Trades (Buy/Sell)</div>
            <div class="card-value white" id="val-opentrades" style="font-size: 16px;">0 (B:0 / S:0)</div>
        </div>

        <div class="card">
            <div class="card-label">Max Drawdown</div>
            <div class="card-value red" id="val-dd">$0.00</div>
        </div>
        <div class="card">
            <div class="card-label">Max Margin Use</div>
            <div class="card-value white" id="val-maxmargin">$0.00</div>
        </div>

        <div class="card">
            <div class="card-label">Current Margin</div>
            <div class="card-value white" id="val-margin">$0.00</div>
        </div>
        <div class="card">
            <div class="card-label">Max Open Trades (24h)</div>
            <div class="card-value yellow" id="val-maxtrades">0</div>
        </div>

        <div class="card full-width">
            <div class="card-label">Basket Target Progress</div>
            <div class="card-value yellow" id="val-target" style="font-size: 16px;">Target: $50.00 (Current P/L: $0.00)</div>
        </div>
    </div>

    <div class="footer-time" id="val-time">Last Updated: Connecting...</div>
</div>

<script>
    async function fetchDashboardData() {
        try {
            let response = await fetch('https://mehul-grid-dashboard-default-rtdb.firebaseio.com/dashboard.json');
            if (response.ok) {
                let data = await response.json();
                if(data) {
                    document.getElementById('val-bal-eq').innerText = `${data.balance} / ${data.equity || data.balance}`;
                    document.getElementById('val-todaypl').innerText = data.todaypl;
                    document.getElementById('val-floatingpl').innerText = data.pl;
                    document.getElementById('val-opentrades').innerText = `${data.buys + data.sells} (B:${data.buys} / S:${data.sells})`;
                    document.getElementById('val-dd').innerText = data.drawdown;
                    document.getElementById('val-maxmargin').innerText = data.maxmargin;
                    document.getElementById('val-margin').innerText = data.margin;
                    document.getElementById('val-maxtrades').innerText = data.maxtrades;
                    document.getElementById('val-target').innerText = `Target: ${data.target} (Current P/L: ${data.pl})`;
                    
                    let now = new Date();
                    document.getElementById('val-time').innerText = "Last Updated: " + now.toISOString().slice(0, 19).replace('T', ' ');
                }
            }
        } catch (error) {
            console.log("Waiting for sync...");
        }
    }
    setInterval(fetchDashboardData, 1000);
</script>

</body>
</html>
